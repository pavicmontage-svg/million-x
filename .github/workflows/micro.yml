name: micro
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "module under millionx.micro to run (availability | ingest | research)"
        required: true
        default: availability
      args:
        description: "extra arguments"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  micro:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: backend/data
          key: micro-data-${{ inputs.cmd }}-v1
      - run: mkdir -p /tmp/mo && python -m millionx.micro.${{ inputs.cmd }} --out /tmp/mo/${{ inputs.cmd }}.json ${{ inputs.args }}
      - run: cat /tmp/mo/*.md >> $GITHUB_STEP_SUMMARY || true
      - name: Publish to branch micro-${{ inputs.cmd }}
        run: |
          cd /tmp/mo && git init -q -b "micro-${{ inputs.cmd }}" && git add . \
            && git -c user.name=ci -c user.email=ci@local commit -qm "micro ${{ inputs.cmd }} ${GITHUB_SHA::7}" \
            && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "micro-${{ inputs.cmd }}"
