name: research2
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        bot: [bot1_vwap, bot2_ema, bot3_orderflow, bot4_breakout, bot5_squeeze, bot6_rsidiv, bot7_liquidity,
              bot8_supertrend, bot9_rangeexp, bot10_adaptive, protoA_trend_pullback, protoB_sweep_reversal,
              protoC_breakout_retest, protoD_cost_momentum, bot1_vwap_v2, bot2_ema_v2, bot3_orderflow_v2,
              bot4_breakout_v2, bot5_squeeze_v2, bot6_rsidiv_v2, bot7_liquidity_v2, bot8_supertrend_v2,
              bot9_rangeexp_v2]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: backend/data/klines
          key: klines-10sym-2025-01-2026-06-v1
      - run: mkdir -p /tmp/r2 && python -m millionx.research2 run --bot ${{ matrix.bot }} --out /tmp/r2/r2_${{ matrix.bot }}.json
      # artifact storage quota is full on this account: each result goes to its own branch r2-<bot>
      - name: Publish to branch r2-${{ matrix.bot }}
        run: |
          cd /tmp/r2 && git init -q -b "r2-${{ matrix.bot }}" && git add . \
            && git -c user.name=ci -c user.email=ci@local commit -qm "r2 ${{ matrix.bot }} ${GITHUB_SHA::7}" \
            && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "r2-${{ matrix.bot }}"
  aggregate:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect per-strategy results (branches r2-*)
        run: |
          mkdir -p /tmp/r2 && cd /tmp/r2
          URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          for ref in $(git ls-remote "$URL" 'refs/heads/r2-*' | cut -f2); do
            b=${ref#refs/heads/}; git clone -q --depth 1 -b "$b" "$URL" "/tmp/c_$b" && cp /tmp/c_$b/*.json /tmp/r2/ || true
          done
          ls -la /tmp/r2
      - run: python -m millionx.research2 aggregate --inputs "/tmp/r2/r2_*.json" --out /tmp/r2/research2.json --run-id ${{ github.run_id }}
      - run: mkdir -p /tmp/r2/docs && python -m millionx.report2 --input /tmp/r2/research2.json --out-dir /tmp/r2/docs --run "research2 run ${{ github.run_id }}"
      - run: cat /tmp/r2/research2.md >> $GITHUB_STEP_SUMMARY
      - name: Publish to branch research2
        run: |
          cd /tmp/r2 && git init -q -b research2 && git add . \
            && git -c user.name=ci -c user.email=ci@local commit -qm "research2 ${GITHUB_SHA::7}" \
            && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" research2
