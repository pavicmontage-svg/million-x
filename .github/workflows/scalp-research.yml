name: scalp-research
on:
  workflow_dispatch:
    inputs:
      args:
        description: "extra arguments for the per-symbol run (e.g. --max-days 10)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT, BNBUSDT, DOGEUSDT, ADAUSDT, LINKUSDT, AVAXUSDT, LTCUSDT]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pandas
      - run: mkdir -p /tmp/sc && python -m millionx.scalp.research run --symbol ${{ matrix.symbol }} --out /tmp/sc/sc_${{ matrix.symbol }}.npz ${{ inputs.args }}
      - name: Publish to branch sc-${{ matrix.symbol }}
        run: |
          cd /tmp/sc && ls -la && git init -q -b "sc-${{ matrix.symbol }}" && git add . \
            && git -c user.name=ci -c user.email=ci@local commit -qm "scalp research ${{ matrix.symbol }} ${GITHUB_SHA::7} run ${{ github.run_id }}" \
            && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "sc-${{ matrix.symbol }}"
  aggregate:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pandas
      - name: Collect per-symbol candidates (branches sc-*)
        run: |
          mkdir -p /tmp/sc
          URL="https://github.com/${GITHUB_REPOSITORY}.git"
          for ref in $(git ls-remote "$URL" 'refs/heads/sc-*' | cut -f2); do
            b=${ref#refs/heads/}; git clone -q --depth 1 -b "$b" "$URL" "/tmp/c_$b" && cp /tmp/c_$b/*.npz /tmp/sc/
          done
          ls -la /tmp/sc
      - run: mkdir -p /tmp/sr && python -m millionx.scalp.research aggregate --inputs "/tmp/sc/sc_*.npz" --out /tmp/sr/scalp_research.json
      - run: cat /tmp/sr/scalp_research.md >> $GITHUB_STEP_SUMMARY
      - name: Publish to branch scalp-research
        run: |
          cd /tmp/sr && git init -q -b scalp-research && git add . \
            && git -c user.name=ci -c user.email=ci@local commit -qm "scalp research ${GITHUB_SHA::7} run ${{ github.run_id }}" \
            && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" scalp-research
