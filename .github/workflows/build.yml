name: build

on:
  push:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v tests

  backend-tests-android-versions:
    # same library versions as the APK's embedded Python (Chaquopy builds)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "numpy==1.26.2" "cryptography==42.0.8" starlette uvicorn wsproto requests pyyaml pytest
      - run: python -m pytest -q tests

  docker-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build image and run the server exactly like the cloud-init install
        run: |
          cp .env.example .env
          MK=$(openssl rand -base64 32 | tr '+/' '-_')
          sed -i "s|^MX_MASTER_KEY=.*|MX_MASTER_KEY=${MK}|; s|^MX_DOMAIN=.*|MX_DOMAIN=localhost|" .env
          echo "MX_BOOTSTRAP_CODE=TEST-CODE-1234" >> .env
          mkdir -p data/backups secrets && sudo chown -R 10001:10001 data secrets
          docker compose config -q
          docker build -t mx-backend .
          docker run -d --name mx --env-file .env -p 8080:8080 -v "$PWD/data:/app/data" mx-backend
          for i in $(seq 1 30); do curl -s -o /dev/null -w "%{http_code}" localhost:8080/api/health | grep -qE "200|503" && break; sleep 2; done
          echo "health:"; curl -s localhost:8080/api/health; echo
          TOKEN=$(curl -s -X POST localhost:8080/api/pair -H 'content-type: application/json' \
                  -d '{"code":"test-code-1234","device_name":"ci"}' | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")
          curl -sf localhost:8080/api/dashboard -H "authorization: Bearer $TOKEN" | head -c 600; echo
          curl -sf localhost:8080/api/bots -H "authorization: Bearer $TOKEN" | python3 -c "import json,sys; assert len(json.load(sys.stdin))==10; print('10 bots OK')"
          test -f data/millionx.db && echo "database persisted on the host volume"
          docker logs mx 2>&1 | tail -20

  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - name: Optional Firebase config (secret GOOGLE_SERVICES_JSON_B64)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: if [ -n "$GS" ]; then echo "$GS" | base64 -d > app/google-services.json; fi
      - name: Optional release keystore (secret MX_KEYSTORE_B64)
        env:
          KS: ${{ secrets.MX_KEYSTORE_B64 }}
        run: if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/mx.jks"; echo "MX_KEYSTORE_FILE=$RUNNER_TEMP/mx.jks" >> "$GITHUB_ENV"; fi
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Android unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build release APK (signed only with the owner's key)
        env:
          MX_KEYSTORE_PASSWORD: ${{ secrets.MX_KEYSTORE_PASSWORD }}
          MX_KEY_ALIAS: ${{ secrets.MX_KEY_ALIAS }}
          MX_KEY_PASSWORD: ${{ secrets.MX_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        continue-on-error: true  # account artifact quota may be full; APKs are also pushed to branch 'apk'
        with:
          name: million-x-apk
          path: android/app/build/outputs/apk/
      - name: Publish APKs to branch 'apk'
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/apk
          ls -la app/build/outputs/apk/debug app/build/outputs/apk/release || true
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk "/tmp/apk/MillionX-${GITHUB_SHA::7}-phone-arm64-DEBUG-not-for-production.apk"
          if [ -f app/build/outputs/apk/release/app-arm64-v8a-release.apk ]; then
            cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "/tmp/apk/MillionX-${GITHUB_SHA::7}-phone-arm64-release-signed.apk"
          else
            echo "No signing key configured: release APK is unsigned and not published." > /tmp/apk/RELEASE-NOT-SIGNED.txt
          fi
          cd /tmp/apk && git init -q -b apk && git add . \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "APK ${GITHUB_SHA::7}" \
            && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk

  android-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: chmod +x gradlew && ./gradlew --no-daemon connectedDebugAndroidTest
