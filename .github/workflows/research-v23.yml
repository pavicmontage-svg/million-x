name: research-v23
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdir -p /tmp/v23 && python -m millionx.strat23.research --out /tmp/v23/v23_research.json
      - run: cat /tmp/v23/v23_research.md >> $GITHUB_STEP_SUMMARY
      - name: Publish to branch research-v23
        run: |
          cd /tmp/v23 && git init -q -b research-v23 && git add . \
            && git -c user.name=ci -c user.email=ci@local commit -qm "v23 research ${GITHUB_SHA::7} run ${{ github.run_id }}" \
            && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" research-v23
